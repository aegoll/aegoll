<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="tesoro: spend rising into a hard ceiling, the fourth payment stopped at it">
  <title>tesoro</title>
  <!-- The layer: a closed boundary money is decided inside. -->
  <rect x="6" y="6" width="84" height="84" rx="20" fill="none" stroke="#e9e9e6" stroke-width="4"/>

  <!-- Three approved actions, growing. -->
  <rect x="21" y="58" width="11" height="18" rx="2" fill="#8fb3e0"/>
  <rect x="37" y="48" width="11" height="28" rx="2" fill="#8fb3e0"/>
  <rect x="53" y="38" width="11" height="38" rx="2" fill="#8fb3e0"/>

  <!-- The fourth would have gone here. It does not. Dashed, because it never happened. -->
  <rect x="69" y="17" width="11" height="17" rx="2" fill="none" stroke="#e8635f"
        stroke-width="2" stroke-dasharray="3 3" opacity="0.75"/>
  <!-- What it was allowed instead: stopped exactly at the ceiling. -->
  <rect x="69" y="34" width="11" height="42" rx="2" fill="#e8635f"/>

  <!-- The ceiling. Drawn last so it sits on top of the bar it stops. -->
  <line x1="16" y1="34" x2="82" y2="34" stroke="#e9e9e6" stroke-width="5" stroke-linecap="round"/>
</svg>
