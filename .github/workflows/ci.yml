name: ci

on:
  push:
    branches: [main]
  pull_request:

# The prototype was developed on Windows. Test both, so a path bug is not
# discovered at install time by someone else.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with dev extras only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest tests -q

  purity:
    # The invariants that stop being true silently. Each is a test, not a doc.
    #   - no LLM client imported outside advisors/
    #   - no filesystem, network or wall clock inside engines/
    #   - engines/ imports nothing from adapters/ or advisors/
    #   - no engine family imports a sibling family
    #   - core installs no framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core only, no extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Purity suite
        run: pytest tests/test_no_llm.py tests/test_deps.py tests/test_engines.py -q
      - name: Core imports nothing unexpected
        run: python -c "import tesoro, sys; print(sorted(m for m in sys.modules if not m.startswith('_')))"

  schema-drift:
    # The vendored AEGS schemas must match the standard at the commit they are
    # pinned to. This drifted within hours of the first pin -- the standard
    # rewrote every $id and the copies here silently kept a dead one -- so the
    # check exists because it has already been needed once.
    #
    # Needs a token while aegoll/aegs is private, and skips without one rather
    # than guessing whether a 404 means "no access" or "file deleted".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vendored schemas match the pin
        env:
          GITHUB_TOKEN: ${{ secrets.AEGS_READ_TOKEN }}
        run: python tools/check_schema_drift.py

  vectors:
    # AEGS test vectors. A failure here is either a spec bug or a code bug,
    # and which one must be stated in writing. Never quietly fixed.
    #
    # This job used to carry `continue-on-error` and check out only this
    # repository, so the runner searched for a sibling aegs/, found none, and
    # skipped all 151 vectors behind a green tick. The vectors are now vendored
    # under tests/_vectors/ against a pin, so there is nothing to be lenient
    # about and the job is a real gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Vectors
        run: pytest tests/test_vectors.py -q
      - name: The suite did not skip
        # A skip here means the vendored copy is gone. Without this, a deleted
        # fixture directory reads as a pass.
        run: pytest tests/test_vectors.py -q -k vendored_copy_exists --no-header -rN

  redteam:
    # 18 attacks, ported from the prototype (PLAN A11.1). Recorded score:
    # 14 defended, 1 defended by accident, 3 undefended, 0 error.
    #
    # The job asserts the score has not *changed*, not that it is perfect. Both directions
    # fail: a defence that regressed is a vulnerability, and a gap that closed is a claim the
    # CHANGELOG, the docs site and the specification's security section all still make.
    #
    # This job used to test `-d tests/redteam` and print a note when it was absent -- which it
    # always was, since the suite lives at `redteam/`. The condition was honest about not being
    # ported and still passed green for every commit in between. A conditional whose false
    # branch is a green job is a job that reports nothing; the suite is unconditional now.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: The suite is where the tests think it is
        run: test -f redteam/runner.py && test -f redteam/baseline.json
      - name: Red team
        run: pytest tests/test_redteam.py -q
      - name: The score, for a human reading this log
        # Costs three seconds and no tokens, because no model sits in the decision path. The
        # readable form is worth having in the log next to the pass: `DEFENDED_BY_ACCIDENT` is
        # a finding, and a green check is a bad place to record one.
        run: python -m redteam.runner
